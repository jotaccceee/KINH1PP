kind = "web"
previewPath = "/"
title = "Moda Control"
description = "Sistema liviano de gestión comercial para emprendimientos de ropa, con dashboard, clientes, ventas, inventario y gastos persistidos localmente."
version = "1.0.0"
id = "artifacts/moda-control"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20058

[services.development]
run = "pnpm --filter @workspace/moda-control run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/moda-control", "run", "build" ]
serve = "static"
publicDir = "artifacts/moda-control/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20058"
BASE_PATH = "/"
