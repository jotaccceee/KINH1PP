[build]
  command = "cd artifacts/moda-control && pnpm run build && mkdir -p ../../dist && cp -r public/* ../../dist/ 2>/dev/null || true && cp -r dist/* ../../dist/ 2>/dev/null || true"
  publish = "dist"

[build.environment]
  PORT = "3000"
  BASE_PATH = "/"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
